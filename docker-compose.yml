services:
  app:
    build:
      context: ./docker/php
      args:
        UID: 1000
    volumes:
      - ./:/var/www/html
    networks:
      mysql_net:
        aliases: [app-template]
  nginx:
    image: nginx:alpine
    ports: ["8089:80"]
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    networks: [mysql_net]
networks:
  mysql_net:
    external: true
